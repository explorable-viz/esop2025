name: CI

on: 
  push: 
    branches: ["joe-dev"]
  pull_request:
    branches: ["joe-dev"]
  
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v2

      - uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "0.15.5"
          purs-tidy: "0.9.2"
          psa: "0.8.2"
          spago: "0.20.9"


      - name: Setup Node toolchain
        uses: actions/setup-node@v2
        with:
          node-version: "18.x"
      
      - name: Install NPM dependencies
        run: |
          npm install -g spago
          npm install
      
      - name: Build project
        run: |
          cd examples/alga-examples
          spago build