name: CI

on:
  push:
    branches: ["main", "joe-dev", "roly-dev"]
  pull_request:
    branches: ["main", "joe-dev", "roly-dev"]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-12]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v2

      - name: Setup Node toolchain
        uses: actions/setup-node@v2
        with:
          node-version: "18.x"

      - name: Install NPM dependencies
        run: |
          cd examples/alga-examples
          npm install

      - name: Build project
        run: |
          cd examples/alga-examples
          npx spago build
